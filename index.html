<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>時間割ナビ 教員用</title>
<meta name="theme-color" content="#3730a3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233730a3'/%3E%3Cpath d='M16 20h32M16 32h32M16 44h20' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f4f8; --card:#fff; --ink:#1d2030; --sub:#5d6275; --line:#e2e4ee;
  --accent:#3730a3; --accent-ink:#fff; --accent-soft:#e8e7fb; --warn:#b45309; --warn-soft:#fdf3e2;
  --off:#9a9fb2; --off-bg:#eceef4; --now:#f59e0b; --free:#15803d; --free-soft:#e5f5ea;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12131a; --card:#1b1d27; --ink:#e8e9f1; --sub:#a4a8bb; --line:#2c2f3d;
    --accent:#a5b4fc; --accent-ink:#14163a; --accent-soft:#25284a; --warn:#fbbf24; --warn-soft:#3a2e14;
    --off:#6c7083; --off-bg:#20222d; --now:#fbbf24; --free:#4ade80; --free-soft:#173022;
  }
}
:root[data-theme="dark"]{
  --bg:#12131a; --card:#1b1d27; --ink:#e8e9f1; --sub:#a4a8bb; --line:#2c2f3d;
  --accent:#a5b4fc; --accent-ink:#14163a; --accent-soft:#25284a; --warn:#fbbf24; --warn-soft:#3a2e14;
  --off:#6c7083; --off-bg:#20222d; --now:#fbbf24; --free:#4ade80; --free-soft:#173022;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:600px;margin:0 auto;padding:0 16px 48px}
header{padding:12px 0 4px}
.top{display:flex;align-items:center;gap:8px}
.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{font-weight:normal;color:var(--sub);font-size:14px;margin-left:6px}
.btn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.datebar{display:flex;align-items:center;gap:8px;margin-top:10px}
.datebar .arrow{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px;cursor:pointer;flex:none}
.datebar .day{flex:1;text-align:center;font-weight:700;font-size:20px;white-space:nowrap}
.datebar .day small{display:block;font-size:14px;font-weight:normal;color:var(--sub);line-height:1.2}
.week{display:flex;gap:6px;margin-top:10px}
.week button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;line-height:1.15;font-size:15px;padding:4px 0}
.week button small{display:block;font-size:14px;color:var(--sub)}
.week button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.week button.sel small{color:inherit;opacity:.9}
.week button.today:not(.sel){border-color:var(--accent);color:var(--accent);font-weight:700}
.week button.holiday:not(.sel){color:var(--off)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 4px}
.tabs button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px;padding:0 2px;white-space:nowrap}
.tabs button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.notice{border-radius:14px;padding:12px 14px;margin:10px 0;font-size:15px;background:var(--warn-soft);border-left:5px solid var(--warn)}
.notice b{color:var(--warn)}
.notice.info{background:var(--accent-soft);border-left-color:var(--accent)}
.notice.info b{color:var(--accent)}
.off{text-align:center;padding:32px 16px;background:var(--card);border-radius:16px;margin-top:10px;color:var(--sub)}
.off .big{font-size:20px;font-weight:700;color:var(--ink);margin-bottom:4px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.period{display:flex;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;border:2px solid transparent;position:relative}
.period .no{flex:none;width:44px;text-align:center}
.period .no b{display:block;font-size:22px;line-height:1.1}
.period .no small{display:block;font-size:14px;color:var(--sub);line-height:1.25;white-space:nowrap}
.period .body{flex:1;min-width:0;border-left:4px solid var(--accent);padding-left:12px}
.period .subj{font-size:18px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.period .subj .cls{font-size:16px;font-weight:600;color:var(--accent);margin-left:6px;white-space:nowrap}
.period .room{margin-top:4px;font-size:16px;display:flex;align-items:flex-start;gap:6px}
.period .room svg{flex:none;margin-top:4px}
.period .room b{font-size:17px}
.period .alts{font-size:14px;color:var(--sub)}
.period.free .body{border-left-color:var(--free)}
.period.free .subj{color:var(--free);font-weight:600;font-size:16px}
.period.misc .body{border-left-color:var(--off)}
.period.misc .subj{color:var(--sub);font-weight:600;font-size:16px}
.period.cut{background:var(--off-bg)}
.period.cut .subj{color:var(--off);text-decoration:line-through}
.period.now{border-color:var(--now)}
.period.now::after{content:"いまここ";position:absolute;top:-10px;right:12px;background:var(--now);color:#1c1300;font-size:14px;font-weight:700;padding:0 8px;border-radius:999px;line-height:20px}
.break{font-size:14px;color:var(--sub);padding:2px 4px 2px 70px}
h2{font-size:16px;margin:22px 0 6px;color:var(--sub)}
.card{background:var(--card);border-radius:16px;padding:6px 14px}
.row{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;font-size:15px}
.row:last-child{border-bottom:0}
.row .k{flex:none;width:92px;font-size:14px;color:var(--sub)}
.row .v{flex:1;min-width:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;min-width:48px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:16px}
.chip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.pchips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.pchips .chip{min-width:0;padding:0}
.group{margin-top:12px}
.group .gl{font-size:14px;color:var(--sub);margin-bottom:6px}
.tag{display:inline-flex;align-items:center;min-height:36px;padding:2px 10px;border-radius:10px;background:var(--free-soft);color:var(--ink);font-size:15px;margin:0 6px 6px 0}
.tag.busy{background:var(--off-bg);color:var(--sub)}
.muted{color:var(--sub);font-size:14px}
select{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:16px}
.lock{max-width:420px;margin:12vh auto 0;padding:0 16px}
.lock .card{padding:20px 16px}
.lock h1{font-size:20px;margin:0 0 4px}
.lock input[type=password],.lock input[type=text]{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;margin:12px 0 8px}
.lock label{display:flex;align-items:center;gap:8px;min-height:44px;font-size:15px;color:var(--sub)}
.lock label input{width:20px;height:20px}
.err{color:#dc2626;font-size:14px;min-height:20px}
.weekview .d{background:var(--card);border-radius:16px;padding:10px 14px;margin-top:10px}
.weekview .d h3{margin:0 0 6px;font-size:17px}
.weekview .d h3 small{font-size:14px;font-weight:normal;color:var(--warn);margin-left:6px}
.weekview .r{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.weekview .r .n{flex:none;width:22px;font-weight:700;color:var(--sub);text-align:center}
.weekview .r .s{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.weekview .r .s.dim{font-weight:normal;color:var(--sub)}
.weekview .r .rm{flex:none;max-width:42%;text-align:right;color:var(--sub);font-size:14px}
footer{margin-top:28px;font-size:14px;color:var(--sub)}
footer p{margin:6px 0}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;min-height:44px;padding:0;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script src="data.enc.js?v=d4d64840a7"></script>
<script>
(() => {
const PWKEY = 'jikanwari-staff.pw', MEKEY = 'jikanwari-staff.me';
const WD = ['日','月','火','水','木','金','土'];
const PIN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const set = (k,v) => { try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} };
const app = document.getElementById('app');
let D = null, me = get(MEKEY) || '', view = 'mine', cur = startOfDay(new Date()), selP = null, mineWeek = false;

// ---------- 暗号を解く
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const E = window.ENC;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(E.salt), iterations:E.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(E.iv)}, key, b64(E.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function lockScreen(msg){
  app.innerHTML = `<div class="lock"><div class="card">
    <h1>時間割ナビ（教員用）</h1>
    <div class="muted">校内の先生向けです。合言葉を入れてください。</div>
    <form id="f"><input type="password" id="pw" autocomplete="current-password" placeholder="合言葉" aria-label="合言葉">
    <label><input type="checkbox" id="keep" checked>この端末で覚える</label>
    <div class="err">${esc(msg||'')}</div>
    <button class="btn primary" style="width:100%">ひらく</button></form></div></div>`;
  document.getElementById('f').onsubmit = async ev => {
    ev.preventDefault();
    const pw = document.getElementById('pw').value.trim();
    try{ D = await unlock(pw); if(document.getElementById('keep').checked) set(PWKEY, pw); render(); }
    catch(e){ lockScreen('合言葉がちがいます'); }
  };
}

// ---------- 日付
function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function monday(d){ const w=d.getDay(); return addDays(d, w===0? 1 : (w===6? 2 : 1-w)); }
function md(d){ return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function tokens(s){ return String(s||'全員').split(/[\s、,・]+/).filter(Boolean); }
function range(s){ const out=[]; String(s||'').split(/[,、]/).forEach(p => { const m=p.match(/(\d)\s*[-〜~]\s*(\d)/); if(m){ for(let i=+m[1];i<=+m[2];i++) out.push(i); } else if(/\d/.test(p)) out.push(+p.match(/\d/)[0]); }); return out; }
function isReady(ds){ const r = D.ready || []; if(!r.length) return true; const m = ds.slice(0,7); return r.includes(m) || m < r[0]; }
const ABBR_GROUP = /委員会$|部$|会$|係$|セミナー$/;

// ---------- その日の様子
function dayInfo(d){
  const ds = iso(d);
  const evs = D.events.filter(e => e['日付'] <= ds && ds <= (e['まで'] || e['日付']));
  const all = evs.filter(e => tokens(e['対象']).some(t => t==='全員' || t==='全校'));
  const info = { d, ds, evs, off:null, pending:false, special:D.special[ds] || null, wd:d.getDay(), staff:D.staffEvents[ds] || [] };
  if(!isReady(ds)){ info.pending = true; return info; }
  const sw = all.find(e => e['種類']==='曜日'); if(sw){ const k = WD.indexOf(String(sw['内容']).trim()[0]); if(k>0) info.wd = k; }
  const off = all.find(e => e['種類']==='休み');
  if(off) info.off = off['内容'];
  else if((d.getDay()===0 || d.getDay()===6) && !sw && !info.special) info.off = WD[d.getDay()]+'曜日';
  info.periods = info.special ? info.special.periods : 7;
  info.cuts = all.filter(e => e['種類']==='カット');
  info.reps = all.filter(e => e['種類']==='差し替え');
  return info;
}
// 先生のその日のコマ: [{p, label, rooms, est}]
function teacherDay(name, info){
  const out = [];
  for(let p=1; p<=info.periods; p++){
    let label, rooms, est = false;
    if(info.special){ const t = info.special.t[name]; label = t ? t.l[p-1] : ''; rooms = t ? t.r[p-1] : []; est = true; }
    else { const i = (info.wd-1)*7 + (p-1); label = (D.base[name]||[])[i] || ''; rooms = (D.baseRooms[name]||[])[i] || []; }
    const cut = info.cuts.find(e => !e['時限'] || range(e['時限']).includes(p));
    const rep = info.reps.find(e => range(e['時限']).includes(p));
    out.push({p, label, rooms, est, cut: cut && !rep ? (cut['内容']||'授業なし') : '', rep: rep ? rep['内容'] : ''});
  }
  return out;
}
function kind(label){
  if(!label) return 'free';
  if(/\n/.test(label) && !/^[(（]/.test(label)) return 'class';
  if(/[１２３][Ａ-Ｆ]/.test(label)) return 'class';
  return 'misc';
}
function splitLabel(label){
  const ls = label.split('\n'); if(ls.length>1) return {s: ls.slice(0,-1).join(''), c: ls.at(-1)};
  const m = label.match(/^(.+?)([１２３][Ａ-Ｆ]+)$/); return m ? {s:m[1], c:m[2]} : {s:label, c:''};
}
function times(){ return D.jitei['通常'] || []; }
function tm(p){ return times().find(t => String(t.p)===String(p)); }

// ---------- 画面
function render(){
  const today = startOfDay(new Date()), mon = monday(cur);
  let wk = '';
  for(let i=0;i<5;i++){ const d = addDays(mon,i), inf = dayInfo(d);
    wk += `<button data-d="${iso(d)}" class="${iso(d)===iso(cur)?'sel':''} ${iso(d)===iso(today)?'today':''} ${inf.off||inf.pending?'holiday':''}">${WD[d.getDay()]}<small>${d.getMonth()+1}/${d.getDate()}</small></button>`; }
  const lab = iso(cur)===iso(today) ? '今日' : iso(cur)===iso(addDays(today,1)) ? '明日' : '';
  let h = `<div class="wrap"><header>
    <div class="top"><h1>時間割ナビ<small>教員用・${esc(D.year)}</small></h1>${iso(cur)!==iso(today)?'<button class="btn" id="todayBtn">今日</button>':''}</div>
    <div class="datebar"><button class="arrow" id="prev" aria-label="前の日">‹</button>
      <div class="day">${md(cur)}（${WD[cur.getDay()]}）<small>${lab||'&nbsp;'}</small></div>
      <button class="arrow" id="next" aria-label="次の日">›</button></div>
    <div class="week">${wk}</div>
    <div class="tabs">${[['mine','自分の時間割'],['rooms','空き教室'],['free','空きコマ'],['plan','予定']].map(([k,t]) => `<button data-v="${k}" class="${view===k?'sel':''}">${t}</button>`).join('')}</div>
  </header>`;
  const info = dayInfo(cur);
  if(info.pending) h += `<div class="off"><div class="big">${cur.getMonth()+1}月は準備中です</div>月間行事予定が出たら表示します。</div>`;
  else if(view==='mine') h += mineHTML(info);
  else if(view==='rooms') h += roomsHTML(info);
  else if(view==='free') h += freeHTML(info);
  else h += planHTML(info);
  h += `<footer><p>もとの資料：${esc(D.year)} 職員版時間割・教室配当・特別時間割（教員版）・月間行事予定。特別時間割の日の教室は、ふだんの教室配当から出した目安です。</p>
    <p>データ更新：${esc(D.updated)}　<button class="link" id="logout">この端末の合言葉を消す</button></p></footer></div>`;
  app.innerHTML = h;
  bind();
}

function specialNote(info){ return info.special ? `<div class="notice info"><b>特別時間割</b>　${esc(info.special.src)}${info.special.note?'／'+esc(info.special.note):''}</div>` : ''; }
function offHTML(info){ return `<div class="off"><div class="big">授業はありません</div>${esc(info.off)}</div>`; }
function curP(info){
  if(iso(new Date())!==info.ds) return null;
  const n = new Date(), hm = n.getHours()*60+n.getMinutes(), toMin = s => { const [a,b] = String(s).split(':').map(Number); return a*60+b; };
  for(let p=1;p<=info.periods;p++){ const t = tm(p); if(t && hm >= toMin(t.start)-10 && hm <= toMin(t.end)) return p; }
  return null;
}

function mineHTML(info){
  let h = `<div style="margin-top:10px"><select id="meSel" aria-label="自分の名前"><option value="">名前を選んでください</option>`;
  const byK = {}; D.teachers.forEach(t => (byK[t.kyoka] ||= []).push(t));
  Object.entries(byK).forEach(([k, ts]) => { h += `<optgroup label="${esc(k)}">` + ts.map(t => `<option ${t.name===me?'selected':''}>${esc(t.name)}</option>`).join('') + `</optgroup>`; });
  h += `</select></div>`;
  if(!me) return h;
  h += `<div class="chips" style="margin-top:10px"><button class="chip ${!mineWeek?'sel':''}" data-mw="0">1日</button><button class="chip ${mineWeek?'sel':''}" data-mw="1">1週間</button></div>`;
  if(mineWeek) return h + weekHTML();
  if(info.off) return h + offHTML(info) + planBrief(info);
  h += specialNote(info);
  const now = curP(info);
  h += '<div class="list">';
  teacherDay(me, info).forEach(x => {
    if(x.p===5) h += `<div class="break">昼休み</div>`;
    const k = kind(x.label), t = tm(x.p);
    const cls = ['period', k==='free'?'free':k==='misc'?'misc':'', x.cut?'cut':'', now===x.p?'now':''].join(' ');
    let body;
    if(x.rep) body = `<div class="subj">${esc(x.rep)}</div><div class="alts">全体の予定${x.label?'（もとは '+esc(splitLabel(x.label).s)+'）':''}</div>`;
    else if(k==='free') body = `<div class="subj">空き</div>`;
    else if(k==='misc') body = `<div class="subj">${esc(x.label.replace(/\n/g,' '))}</div>`;
    else { const sl = splitLabel(x.label);
      body = `<div class="subj">${esc(sl.s)}<span class="cls">${esc(sl.c)}</span></div>` +
        (x.rooms.length ? `<div class="room">${PIN}<b>${esc(x.rooms.join('・'))}</b></div>` : '') +
        (x.rooms.length>1 ? `<div class="alts">分割・選択で複数の教室を使います</div>` : '') +
        (x.est && x.rooms.length ? `<div class="alts">教室は目安</div>` : ''); }
    if(x.cut) body += `<div class="alts">${esc(x.cut)}</div>`;
    h += `<div class="${cls}"><div class="no"><b>${x.p}</b><small>${t?esc(t.start):''}</small><small>${t?'〜'+esc(t.end):''}</small></div><div class="body">${body}</div></div>`;
  });
  return h + '</div>' + planBrief(info);
}

function weekHTML(){
  const mon = monday(cur); let h = '<div class="weekview">';
  for(let i=0;i<5;i++){
    const info = dayInfo(addDays(mon,i));
    h += `<div class="d"><h3>${md(info.d)}（${WD[info.d.getDay()]}）${info.special?'<small>特別時間割</small>':''}</h3>`;
    if(info.pending){ h += `<div class="muted">準備中</div></div>`; continue; }
    if(info.off){ h += `<div class="muted">授業なし：${esc(info.off)}</div></div>`; continue; }
    teacherDay(me, info).forEach(x => { const k = kind(x.label), sl = k==='class' ? splitLabel(x.label) : null;
      h += `<div class="r"><span class="n">${x.p}</span><span class="s ${k!=='class'||x.cut?'dim':''}">${x.rep?esc(x.rep):k==='class'?esc(sl.s)+' '+esc(sl.c):k==='misc'?esc(x.label.replace(/\n/g,' ')):'空き'}</span><span class="rm">${x.cut?'なし':k==='class'?esc(x.rooms.join('・')):''}</span></div>`; });
    h += '</div>';
  }
  return h + '</div>';
}

function periodPicker(info){
  if(selP==null || selP>info.periods) selP = curP(info) || 1;
  let h = `<div class="pchips">`;
  for(let p=1;p<=7;p++) h += `<button class="chip ${selP===p?'sel':''}" data-p="${p}" ${p>info.periods?'disabled style="opacity:.35"':''}>${p}限</button>`;
  const t = tm(selP);
  return h + `</div><div class="muted" style="margin-top:6px">${selP}限 ${t?esc(t.start)+'〜'+esc(t.end):''}</div>`;
}

function usedRooms(info, p){
  const used = new Set();
  if(info.special){ Object.values(info.special.t).forEach(t => (t.r[p-1]||[]).forEach(r => used.add(r))); }
  else (D.used[String((info.wd-1)*7 + (p-1))] || []).forEach(r => used.add(r));
  return used;
}
function roomsHTML(info){
  if(info.off) return offHTML(info);
  let h = specialNote(info) + periodPicker(info);
  const used = usedRooms(info, selP);
  const cut = info.cuts.some(e => !e['時限'] || range(e['時限']).includes(selP));
  if(cut) h += `<div class="notice"><b>この時限は全体で授業なし</b>　どの教室も授業では使われません。</div>`;
  const groups = {};
  D.rooms.forEach(r => (groups[r.floor] ||= []).push(r.room));
  let nfree = 0;
  Object.entries(groups).forEach(([f, rs]) => {
    const fr = rs.filter(r => cut || !used.has(r)); nfree += fr.length;
    h += `<div class="group"><div class="gl">${esc(f)}</div>${rs.map(r => `<span class="tag ${!cut && used.has(r)?'busy':''}">${esc(r)}${!cut && used.has(r)?'（使用中）':''}</span>`).join('')}</div>`;
  });
  return h + `<p class="muted">空き ${nfree} 室／教室配当の表にある教室だけ。${info.special?'特別時間割の日は目安です。':''}HB・実習室・体育施設などは含みません。</p>`;
}

function freeHTML(info){
  if(info.off) return offHTML(info);
  let h = specialNote(info) + periodPicker(info);
  const fr = {}, misc = [];
  D.teachers.forEach(t => {
    const x = teacherDay(t.name, info)[selP-1]; const k = kind(x.label);
    if(k==='free' || x.cut) (fr[t.kyoka] ||= []).push(t.name);
    else if(k==='misc') misc.push(`${t.name}：${x.label.replace(/[()（）\n]/g,'')}`);
  });
  const n = Object.values(fr).flat().length;
  h += `<h2>授業のない先生（${n}人）</h2>`;
  Object.entries(fr).forEach(([k, ns]) => h += `<div class="group"><div class="gl">${esc(k)}</div>${ns.map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div>`);
  if(misc.length) h += `<h2>会議・中学などが入っている先生（${misc.length}人）</h2><div>${misc.map(x => `<span class="tag busy">${esc(x)}</span>`).join('')}</div>`;
  return h;
}

function planList(info){
  const rows = [];
  info.evs.forEach(e => { if(['行事','連絡','休み','カット','差し替え','時程','曜日'].includes(e['種類'])){
    const who = tokens(e['対象']).filter(t => t!=='全員' && t!=='全校').join(' ');
    rows.push([e['種類']==='カット'?'時程':e['種類']==='差し替え'?(e['時限']+'限'):'生徒', (who?who+'：':'') + e['内容']]); } });
  const after = info.evs.filter(e => ['放課後','委員会','部活'].includes(e['種類']) || tokens(e['対象']).some(t => ABBR_GROUP.test(t)));
  return {rows, after};
}
function planBrief(info){
  const {after} = planList(info);
  const st = info.staff.filter(([c]) => c==='諸会議・研修' || c==='学校行事');
  if(!after.length && !st.length) return '';
  return `<h2>この日の予定</h2><div class="card">${st.map(([c,t]) => `<div class="row"><div class="k">${esc(c)}</div><div class="v">${esc(t)}</div></div>`).join('')}${after.filter(e => !st.some(([,t]) => t===e['内容'])).map(e => `<div class="row"><div class="k">${esc(e['時刻']||'放課後')}</div><div class="v">${esc(e['内容'])}</div></div>`).join('')}</div>`;
}
function planHTML(info){
  let h = specialNote(info);
  if(info.off) h += `<div class="notice"><b>休業日</b>　${esc(info.off)}</div>`;
  if(info.staff.length){
    h += `<h2>月間行事予定</h2><div class="card">` + info.staff.map(([c,t]) => `<div class="row"><div class="k">${esc(c)}</div><div class="v">${esc(t)}</div></div>`).join('') + `</div>`;
  }
  const {rows, after} = planList(info);
  if(rows.length) h += `<h2>生徒用ナビに出している行事・時程</h2><div class="card">` + rows.map(([k,v]) => `<div class="row"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('') + `</div>`;
  if(after.length) h += `<h2>放課後</h2><div class="card">` + after.map(e => `<div class="row"><div class="k">${esc(e['時刻']||'放課後')}</div><div class="v">${esc(e['内容'])}${e['場所']?'（'+esc(e['場所'])+'）':''}</div></div>`).join('') + `</div>`;
  if(!info.staff.length && !rows.length && !after.length) h += `<p class="muted">この日の予定は入っていません。</p>`;
  return h;
}

function bind(){
  const $ = id => document.getElementById(id);
  $('prev').onclick = () => { cur = addDays(cur,-1); render(); };
  $('next').onclick = () => { cur = addDays(cur,1); render(); };
  if($('todayBtn')) $('todayBtn').onclick = () => { cur = startOfDay(new Date()); selP = null; render(); };
  document.querySelectorAll('.week button').forEach(b => b.onclick = () => { const [y,m,d] = b.dataset.d.split('-').map(Number); cur = new Date(y,m-1,d); render(); });
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { view = b.dataset.v; render(); });
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { selP = +b.dataset.p; render(); });
  document.querySelectorAll('[data-mw]').forEach(b => b.onclick = () => { mineWeek = b.dataset.mw==='1'; render(); });
  if($('meSel')) $('meSel').onchange = e => { me = e.target.value; set(MEKEY, me || null); render(); };
  $('logout').onclick = () => { set(PWKEY, null); D = null; lockScreen('この端末の合言葉を消しました'); };
}

function fromHash(){ const m = location.hash.match(/(\d{4})-(\d{2})-(\d{2})/); if(m) cur = new Date(+m[1], +m[2]-1, +m[3]); }
fromHash();
window.addEventListener('hashchange', () => { fromHash(); if(D) render(); });
document.addEventListener('visibilitychange', () => { if(!document.hidden && D) render(); });
const saved = get(PWKEY);
if(saved) unlock(saved).then(d => { D = d; render(); }).catch(() => { set(PWKEY, null); lockScreen(); });
else lockScreen();
})();
</script>
</body>
</html>
